version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 2
  commit-message:
    prefix: "ci(github-actions)"
- package-ecosystem: "npm"
  directory: "/plugins/ui-theme-designer/skills/ui-theme-designer-design-tokens"
  schedule:
    interval: "weekly"
  commit-message:
    prefix: "fix(deps)"
  groups:
    all-non-major:
      update-types:
        - "minor"
        - "patch"
